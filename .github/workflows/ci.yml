name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast tests + spec parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: OpenSpec validate (spec-code parity gate)
        run: npx -y @fission-ai/openspec@1 validate --all --strict
      - name: Fast tests (no containers)
        working-directory: backend
        run: mvn -B -ntp test -Dgroups=fast

  integration:
    name: Integration tests (Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Integration tests
        working-directory: backend
        run: mvn -B -ntp test -Dgroups=integration

  e2e:
    name: E2E tests (Testcontainers Kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: E2E tests
        working-directory: backend
        run: mvn -B -ntp test -Dgroups=e2e
