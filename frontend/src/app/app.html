<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <span class="name">MMx</span>
        <span class="tag">Money market orders</span>
      </div>
    </div>

    <nav class="header-nav" aria-label="Application">
      @if (showDeskEntry()) {
        <a
          [routerLink]="deskReturnUrl()"
          class="header-link"
          [class.active]="deskLinkActive()"
        >
          Desk
        </a>
      }
      <a
        routerLink="/settings"
        class="header-link"
        [class.active]="settingsLinkActive()"
      >
        Settings
      </a>
    </nav>

    <div class="session-controls">
      <label class="scope-switcher">
        <span class="scope-label">Scope</span>
        <select
          class="scope-select"
          [value]="activeScopeKey()"
          (change)="onScopeChange($event)"
          aria-label="Active legal entity and role"
          data-testid="scope-switcher"
        >
          @for (scope of user.heldScopes(); track user.scopeKey(scope)) {
            <option [value]="user.scopeKey(scope)">{{ scopeLabel(scope) }}</option>
          }
        </select>
      </label>

      <label class="trader">
        <span class="trader-label">User</span>
        <input
          type="text"
          class="trader-input"
          [value]="user.userId()"
          (blur)="onUserBlur($event)"
          autocomplete="username"
          spellcheck="false"
          aria-label="User identifier for API requests"
          data-testid="user-id-input"
        />
      </label>
    </div>
  </header>

  <main class="main">
    @if (showDeskNav()) {
    <div class="desk-nav" aria-label="Desk">
      <div class="desk-tabs-scroll desk-tabs-scroll--primary">
        <nav class="desk-tabs desk-primary-tabs" role="tablist" aria-label="Product mode">
          <a
            routerLink="/oncall/received"
            role="tab"
            [class.active]="workspaceActive('oncall')"
            [attr.aria-selected]="workspaceActive('oncall')"
          >
            ON-CALL
          </a>
          <a
            routerLink="/term/received"
            role="tab"
            [class.active]="workspaceActive('term')"
            [attr.aria-selected]="workspaceActive('term')"
          >
            Term
          </a>
        </nav>
      </div>

      <div class="desk-tabs-scroll desk-tabs-scroll--sub">
        <nav class="desk-tabs desk-sub-tabs" role="tablist" aria-label="Order queues">
          <a
            [routerLink]="queuePrefix() + '/received'"
            role="tab"
            [class.active]="queueActive('received')"
            [attr.aria-selected]="queueActive('received')"
          >
            Received
          </a>
          <a
            [routerLink]="queuePrefix() + '/assigned'"
            role="tab"
            [class.active]="queueActive('assigned')"
            [attr.aria-selected]="queueActive('assigned')"
          >
            Assigned
          </a>
          <a
            [routerLink]="queuePrefix() + '/executed'"
            role="tab"
            [class.active]="queueActive('executed')"
            [attr.aria-selected]="queueActive('executed')"
          >
            Executed
          </a>
        </nav>
      </div>
    </div>
    }

    <div class="desk-content" [class.desk-content--settings]="!showDeskNav()">
      <router-outlet />
    </div>
  </main>
</div>
