<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <span class="name">MMx</span>
        <span class="tag">Money market orders</span>
      </div>
    </div>

    <div class="nav-cluster">
      <nav class="nav workspace-nav" aria-label="Workspace">
        <a routerLink="/oncall/received" [class.active]="workspaceActive('oncall')">
          On-call workspace
        </a>
        <a routerLink="/term/received" [class.active]="workspaceActive('term')">
          Term workspace
        </a>
      </nav>

      <nav class="nav sub-nav" aria-label="Queues">
        <a [routerLink]="queuePrefix() + '/received'" [class.active]="queueActive('received')">Received</a>
        <a [routerLink]="queuePrefix() + '/assigned'" [class.active]="queueActive('assigned')">Assigned</a>
        <a [routerLink]="queuePrefix() + '/executed'" [class.active]="queueActive('executed')">Executed</a>
      </nav>
    </div>

    <label class="trader">
      <span class="trader-label">Trader</span>
      <input
        type="text"
        class="trader-input"
        [value]="trader.traderId()"
        (blur)="onTraderBlur($event)"
        autocomplete="username"
        spellcheck="false"
        aria-label="Trader identifier for API requests"
      />
    </label>
  </header>

  <main class="main">
    <router-outlet />
  </main>
</div>
