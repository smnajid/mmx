<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <span class="name">MMx</span>
        <span class="tag">Money market orders</span>
      </div>
    </div>

    <nav class="header-nav" aria-label="Application">
      <a routerLink="/settings/currencies" class="header-link">Currencies</a>
    </nav>

    <label class="trader">
      <span class="trader-label">Trader</span>
      <input
        type="text"
        class="trader-input"
        [value]="trader.traderId()"
        (blur)="onTraderBlur($event)"
        autocomplete="username"
        spellcheck="false"
        aria-label="Trader identifier for API requests"
      />
    </label>
  </header>

  <main class="main">
    @if (showDeskNav()) {
    <div class="desk-nav" aria-label="Desk">
      <div class="desk-tabs-scroll desk-tabs-scroll--primary">
        <nav class="desk-tabs desk-primary-tabs" role="tablist" aria-label="Product mode">
          <a
            routerLink="/oncall/received"
            role="tab"
            [class.active]="workspaceActive('oncall')"
            [attr.aria-selected]="workspaceActive('oncall')"
          >
            ON-CALL
          </a>
          <a
            routerLink="/term/received"
            role="tab"
            [class.active]="workspaceActive('term')"
            [attr.aria-selected]="workspaceActive('term')"
          >
            Term
          </a>
        </nav>
      </div>

      <div class="desk-tabs-scroll desk-tabs-scroll--sub">
        <nav class="desk-tabs desk-sub-tabs" role="tablist" aria-label="Order queues">
          <a
            [routerLink]="queuePrefix() + '/received'"
            role="tab"
            [class.active]="queueActive('received')"
            [attr.aria-selected]="queueActive('received')"
          >
            Received
          </a>
          <a
            [routerLink]="queuePrefix() + '/assigned'"
            role="tab"
            [class.active]="queueActive('assigned')"
            [attr.aria-selected]="queueActive('assigned')"
          >
            Assigned
          </a>
          <a
            [routerLink]="queuePrefix() + '/executed'"
            role="tab"
            [class.active]="queueActive('executed')"
            [attr.aria-selected]="queueActive('executed')"
          >
            Executed
          </a>
        </nav>
      </div>
    </div>
    }

    <div class="desk-content" [class.desk-content--settings]="!showDeskNav()">
      <router-outlet />
    </div>
  </main>
</div>
