<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div class="brand-text">
        <span class="name">MMx</span>
        <span class="tag">Money market orders</span>
      </div>
    </div>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/term-orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Term received
      </a>
      <a routerLink="/oncall-orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        On-call received
      </a>
      <a routerLink="/assigned-orders" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Assigned
      </a>
    </nav>

    <label class="trader">
      <span class="trader-label">Trader</span>
      <input
        type="text"
        class="trader-input"
        [value]="trader.traderId()"
        (blur)="onTraderBlur($event)"
        autocomplete="username"
        spellcheck="false"
        aria-label="Trader identifier for API requests"
      />
    </label>
  </header>

  <main class="main">
    <router-outlet />
  </main>
</div>
