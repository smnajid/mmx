openapi: 3.0.3
info:
  title: Money Market Order Processing API
  description: |
    Contract-first HTTP API for Money Market order processing (V1).
    Human-readable mirror and narrative: [api-v1.md](./api-v1.md).
    Trader-facing operations require header `X-Trader-Id`.
  version: 1.0.0

servers:
  - url: /
    description: Relative to deployment base (e.g. http://localhost:8080)

tags:
  - name: Intake
    description: Portfolio Management order reception (no Trader header)
  - name: Orders
    description: Trader-facing order operations

paths:
  /api/v1/orders:
    post:
      tags: [Intake]
      summary: Receive order (idempotent)
      operationId: receiveOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveOrderRequest"
      responses:
        "201":
          description: New order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveOrderResponse"
        "200":
          description: Duplicate external reference — existing order returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveOrderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/term/received:
    get:
      tags: [Orders]
      summary: List received Term orders
      operationId: listReceivedTermOrders
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged Term orders in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/oncall/received:
    get:
      tags: [Orders]
      summary: List received OnCall orders
      operationId: listReceivedOnCallOrders
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged OnCall orders in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrderDetails
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Orders]
      summary: Update assigned order
      operationId: updateAssignedOrder
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the assigned Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid status for update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/assign:
    post:
      tags: [Orders]
      summary: Assign order to requesting Trader
      operationId: assignOrder
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/unassign:
    post:
      tags: [Orders]
      summary: Unassign order
      operationId: unassignOrder
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "403":
          description: Caller is not the assigned Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in ASSIGNED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/assigned:
    get:
      tags: [Orders]
      summary: List orders assigned to the requesting Trader
      operationId: listAssignedOrders
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged assigned orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/{orderId}/execute:
    post:
      tags: [Orders]
      summary: Record order execution
      operationId: executeOrder
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteOrderRequest"
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "400":
          description: Missing or invalid execution data, or executedRate below MinimumRate when order has a PM floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the assigned Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in ASSIGNED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel received order
      operationId: cancelOrder
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/reject:
    post:
      tags: [Orders]
      summary: Reject received or assigned order
      operationId: rejectOrder
      parameters:
        - $ref: "#/components/parameters/TraderIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOrderRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the assigned Trader (when order is ASSIGNED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order must be in RECEIVED or ASSIGNED status to reject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    TraderIdHeader:
      name: X-Trader-Id
      in: header
      required: true
      description: Trader identity for Trader-facing endpoints
      schema:
        type: string
        minLength: 1

    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Page:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    ErrorCode:
      type: string
      description: Machine-readable error code
      enum:
        - VALIDATION_ERROR
        - ORDER_NOT_FOUND
        - INVALID_STATUS_TRANSITION
        - UNAUTHORIZED_TRADER
        - DUPLICATE_ORDER

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    OrderType:
      type: string
      enum: [TERM, ON_CALL]

    OrderOperation:
      type: string
      enum: [SUBSCRIPTION, INCREASE, DECREASE, REDEMPTION]

    OrderStatus:
      type: string
      enum: [RECEIVED, ASSIGNED, EXECUTED, CANCELLED, REJECTED]

    Tenor:
      type: string
      description: Term tenor code
      enum: ["1W", "2W", "1M", "3M", "6M", "1Y"]

    NoticePeriod:
      type: string
      enum: ["24H", "48H"]

    ReceiveOrderRequest:
      type: object
      required:
        - externalOrderReference
        - orderType
        - orderOperation
        - portfolioNumber
        - currency
        - amount
        - valueDate
      properties:
        externalOrderReference:
          type: string
          maxLength: 100
        orderType:
          $ref: "#/components/schemas/OrderType"
        orderOperation:
          $ref: "#/components/schemas/OrderOperation"
        portfolioNumber:
          type: string
          maxLength: 50
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        valueDate:
          type: string
          format: date
        minimumRate:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Optional PM execution floor; when omitted, Trader executes subject to best market conditions.
        tenor:
          $ref: "#/components/schemas/Tenor"
        noticePeriod:
          $ref: "#/components/schemas/NoticePeriod"
        sourceContractNumber:
          type: string
          nullable: true
          maxLength: 50
        desiredCounterpartyComment:
          type: string
          nullable: true
          maxLength: 500

    ReceiveOrderResponse:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"

    OrderSummaryResponse:
      type: object
      required:
        - orderId
        - externalOrderReference
        - orderType
        - orderOperation
        - portfolioNumber
        - currency
        - amount
        - valueDate
        - status
        - createdAt
      properties:
        orderId:
          type: string
          format: uuid
        externalOrderReference:
          type: string
        orderType:
          $ref: "#/components/schemas/OrderType"
        orderOperation:
          $ref: "#/components/schemas/OrderOperation"
        portfolioNumber:
          type: string
        currency:
          type: string
        amount:
          type: number
          format: double
        valueDate:
          type: string
          format: date
        minimumRate:
          type: number
          format: double
          nullable: true
          description: Present when supplied at intake; Trader cannot alter after reception.
        status:
          $ref: "#/components/schemas/OrderStatus"
        assignedTraderId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    OrderDetailsResponse:
      type: object
      required:
        - orderId
        - externalOrderReference
        - orderType
        - orderOperation
        - portfolioNumber
        - currency
        - amount
        - valueDate
        - status
        - createdAt
        - updatedAt
      properties:
        orderId:
          type: string
          format: uuid
        externalOrderReference:
          type: string
        orderType:
          $ref: "#/components/schemas/OrderType"
        orderOperation:
          $ref: "#/components/schemas/OrderOperation"
        portfolioNumber:
          type: string
        currency:
          type: string
        amount:
          type: number
          format: double
        valueDate:
          type: string
          format: date
        minimumRate:
          type: number
          format: double
          nullable: true
          description: Optional PM execution floor when supplied at intake; immutable after reception.
        tenor:
          type: string
          nullable: true
        noticePeriod:
          type: string
          nullable: true
        sourceContractNumber:
          type: string
          nullable: true
        desiredCounterpartyComment:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        assignedTraderId:
          type: string
          nullable: true
        assignedAt:
          type: string
          format: date-time
          nullable: true
        executedRate:
          type: number
          format: double
          nullable: true
        counterparty:
          type: string
          nullable: true
        executionTime:
          type: string
          format: date-time
          nullable: true
        dealingReference:
          type: string
          nullable: true
        generatedContractNumber:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderSummaryPage:
      type: object
      required: [content, totalElements, page, size]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummaryResponse"
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1

    UpdateOrderRequest:
      type: object
      description: Partial update — only Amount and ValueDate may be changed. MinimumRate and DesiredCounterpartyComment are intake-only and not mutable via this endpoint.
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        valueDate:
          type: string
          format: date

    ExecuteOrderRequest:
      type: object
      required: [executedRate, counterparty]
      properties:
        executedRate:
          type: number
          format: double
          minimum: 0
        counterparty:
          type: string
          minLength: 1
          maxLength: 200

    RejectOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
