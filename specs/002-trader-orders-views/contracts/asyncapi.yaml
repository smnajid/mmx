asyncapi: 3.0.0
info:
  title: mmx Back-office Integration (async)
  version: 1.0.0
  description: |
    Contract-first async surface for mmx → back-office execution handoff.
    Kafka message key MUST be the mmx orderId (UUID string).
    Prose mirror: asyncapi-v1.md

defaultContentType: application/json

channels:
  orderExecuted:
    address: mmx.order.executed
    description: Published when an order transitions to EXECUTED (one message per orderId).
    messages:
      orderExecutedV1:
        $ref: '#/components/messages/OrderExecutedV1'

operations:
  publishOrderExecuted:
    action: send
    channel:
      $ref: '#/channels/orderExecuted'
    summary: mmx publishes execution handoff after transactional outbox relay
    messages:
      - $ref: '#/channels/orderExecuted/messages/orderExecutedV1'

components:
  messages:
    OrderExecutedV1:
      name: OrderExecutedV1
      title: Order executed handoff (v1)
      summary: Thin handoff DTO frozen at schedule time; idempotent on orderId
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Kafka record key = orderId (UUID)
      payload:
        $ref: './schemas/OrderExecutedV1.json'
