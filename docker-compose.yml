name: mmx

services:
  postgres:
    image: postgres:16-alpine
    # Avoid a slow registry/metadata check on every `docker compose up` when the image exists locally.
    pull_policy: missing
    container_name: mmx-postgres
    environment:
      POSTGRES_DB: mmx
      POSTGRES_USER: mmx
      POSTGRES_PASSWORD: mmx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmx -d mmx"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.1.8
    pull_policy: missing
    container_name: mmx-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      # Kafka cluster health alone is insufficient — Schema Registry can fail while brokers are healthy.
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' && curl -sf http://localhost:8081/subjects > /dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  redpanda-console:
    image: redpandadata/console:latest
    pull_policy: missing
    container_name: mmx-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: "http://redpanda:8081"

volumes:
  pgdata:
    driver: local
  redpanda-data:
    driver: local
