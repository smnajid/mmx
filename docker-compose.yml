name: mmx

services:
  postgres:
    image: postgres:16-alpine
    # Avoid a slow registry/metadata check on every `docker compose up` when the image exists locally.
    pull_policy: missing
    container_name: mmx-postgres
    environment:
      POSTGRES_DB: mmx
      POSTGRES_USER: mmx
      POSTGRES_PASSWORD: mmx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmx -d mmx"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    driver: local
