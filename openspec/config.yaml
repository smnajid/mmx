schema: spec-driven

context: |
  **mmx — Money Market order processing (POC)**

  **Stack**
  - Backend: Java, **Spring Boot 4** (parent BOM 4.0.x), Maven multi-module. JUnit 5, Spring Data JPA,
    Flyway, **contract-first OpenAPI** + codegen for REST.
  - Frontend: **Angular** 21.x, standalone components, Vitest via `ng test`, Cypress for e2e where needed.

  **Contract-first product API (mandatory)**
  - The **trader/product HTTP API** is defined only in the **canonical OpenAPI** for the active feature
    (e.g. `contracts/002-trader-orders-views/openapi.yaml`) and its prose mirror **`api-v1.md`**.
  - **Never** implement ad-hoc REST shapes in code first: extend the contract, regenerate server stubs / models,
    then implement controllers against the generated API interfaces and keep runtime behaviour aligned.
  - Frontend and integration tests MUST target paths, parameters, and bodies that match the published contract.


  **Backend architecture — hexagonal / ports & adapters**
  - **`mmx-domain`**: entities, value objects, domain exceptions — no Spring, no framework adapters.
  - **`mmx-application`**: use cases, `port/in` (use case interfaces), `port/out` (repositories, clock, etc.),
    pure application services orchestrating domain.
  - **`mmx-adapter-in-rest`**: HTTP controllers implementing generated API interfaces; DTO mapping; must not own business rules.
  - **`mmx-adapter-out-persistence`** (and other `adapter-out-*`): JPA, Spring Data, integrations — implement `port/out`.
  - **`mmx-bootstrap`**: Spring `@Configuration`, wiring beans, app entry — composition only.
  - Prefer extending existing ports/services over leaking persistence or HTTP concerns into `mmx-domain` /
    `mmx-application`.

  **Test-Driven Development (default)**
  - For **new behaviour** and **bug fixes**: write a **failing automated test first** (red), implement the smallest
    change to pass (green), then refactor. Use the narrowest layer that can fail for the wrong reason
    (unit vs integration vs e2e).
  - Backend: JUnit 5; frontend: Angular/Vitest; HTTP contract: integration tests against running app where appropriate.
  - OpenSpec **`tasks.md` should explicitly call out test tasks** alongside implementation (or order them red-first).

  **Backend verification during apply (fast loop)**
  - Run Maven from **`backend/`**. Prefer **`mvnd`** when installed; otherwise **`mvn`**.
  - **TDD / red-green**: scope to one module and one test class — e.g.
    `mvn test -pl mmx-domain -Dtest=TermRateIngestPolicyTest`.
    Use `-am` only when upstream modules must compile first.
  - **Do not** run full-reactor `mvn test` (all modules including `mmx-bootstrap` Testcontainers) until the
    **Final verification** section of `tasks.md`.
  - `mmx-bootstrap` integration tests (PostgreSQL/Kafka Testcontainers) are the slow path — reserve them for
    that single final full run unless the change only touches bootstrap integration code.

  **Specifications (SDD) — spec–code parity is blocking**
  - Material API or behaviour changes remain aligned with the matching capability specs under `openspec/specs/` and
    canonical contracts under `contracts/` (OpenAPI, `api-v1.md`, etc.) — **same delivery** as implementation.
  - "Material" = REST paths/headers/schemas, domain validation or lifecycle rules, Flyway/DB columns,
    ubiquitous-language terms in UX or errors, queue/list/detail fields, and acceptance criteria.
  - Missing spec updates for a material code change are a **blocking defect**, not a follow-up. Full governance: `docs/governance.md`.


rules:
  proposal:
    - Call out stack assumptions (Spring Boot 4 backend, Angular SPA) and hexagonal module boundaries when scope touches code.
    - Note TDD expectation for behavioural work unless explicitly waived.
    - Any new or changed **product REST** surface MUST be framed as contract-first OpenAPI (+ mirror doc), not controller-first.

  design:
    - Describe adapter placement (which module/port), dependency direction inward toward domain/application, and where tests will live.
    - 'For HTTP: cite canonical **`openapi.yaml`** / **`api-v1.md`** paths and how codegen plugs into `mmx-adapter-in-rest`.'

  specs:
    - Requirements should be testable; tie scenarios to verifiable outcomes suitable for automated tests.
    - If behaviour is exposed over HTTP, requirement text SHOULD be consistent with eventual **OpenAPI** operations and schemas (contract-first).

  tasks:
    - Read `.cursor/skills/tdd/SKILL.md` and align task breakdown with its red-green-refactor workflow and test-quality guidance.
    - Prefer ordering **failing tests before implementation** for new behaviour and fixes (TDD).
    - Backend tasks MUST name layers (`domain` / `application` / `adapter-in-rest` / `adapter-out-*` / `bootstrap`) — no shortcutting through the wrong module.
    - '**REST changes**: explicit steps to update **`openapi.yaml`**, **`api-v1.md`**, run **codegen**, then adapt controllers/domain — never the reverse order.'
    - Frontend tasks SHOULD reference `frontend/` patterns (standalone components, services, existing API client conventions).
    - '**TDD task pairs** (domain/application/adapter unit work): `X.N Write failing <TestClass>` MUST include the exact scoped command, e.g. `` `mvn test -pl mmx-domain -Dtest=TermRateIngestPolicyTest` ``; the following `X.N+1 Implement … until green` MUST NOT add a separate "run mvn test" checkbox — the implement step implies re-running that same `-Dtest` only.'
    - '**Compile/codegen gates** use `mvn compile` or `mvn -pl <module> -am compile` only — never `mvn test` for compile-only checkpoints.'
    - '**No duplicate full suites**: at most one task in the entire `tasks.md` may run full-reactor `cd backend && mvn test`. Place it in a final section titled **Final verification** (or equivalent). Do not add mid-phase tasks like "Run `mvn test` on mmx-application and mmx-adapter-in-rest" when a final full run already exists.'
    - '**Optional scoped gate** (omit if final full run is enough): at most one mid-change task may run `mvn test -pl <comma-separated touched modules> -am` listing only modules changed in this delivery — never bare `mvn test` without `-pl`.'
    - '**Final verification section** (required when backend behaviour changes): include exactly `- [ ] N.1 Run full `cd backend && mvn test` — all modules green`; when frontend behaviour changes, exactly one `- [ ] N.2 Run `npm run test` in `frontend/` — green`; contract/SDD alignment tasks as needed. No other full-reactor `mvn test` or `npm run test` tasks elsewhere.'
    - '**Forbidden in generated tasks**: bare `Run mvn test` without `-pl` and/or `-Dtest`; multiple "full `mvn test`" checkboxes; pairing "implement until tests pass" with an extra "run mvn test on …" in the same section; Cypress unless the change explicitly needs e2e.'
    - Vitest/component tests belong next to the UI task that introduces them; do not add a separate `npm run test` per component when Final verification already runs the suite.
