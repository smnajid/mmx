spring:
  datasource:
    url: jdbc:h2:mem:mmx_rest;MODE=PostgreSQL;DATABASE_TO_LOWER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all

mmx:
  organisation:
    code: LODH
  backoffice:
    kafka:
      topic: mmx.order.executed
    outbox:
      relay-enabled: false
      max-publish-attempts: 5
      poll-interval-ms: 1000
