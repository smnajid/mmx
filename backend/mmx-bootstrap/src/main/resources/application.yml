spring:
  application:
    name: mmx
  datasource:
    url: jdbc:postgresql://localhost:5432/mmx
    username: mmx
    password: mmx
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      acks: all

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  # Serve only the canonical contract (same file as OpenAPI Generator input); avoids runtime scan drift vs specs/002-trader-orders-views/contracts/openapi.yaml
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml

mmx:
  backoffice:
    kafka:
      topic: mmx.order.executed
    outbox:
      relay-enabled: true
      max-publish-attempts: 5
      poll-interval-ms: 1000
