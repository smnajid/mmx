spring:
  application:
    name: mmx
  datasource:
    url: jdbc:postgresql://localhost:5432/mmx
    username: mmx
    password: mmx
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  # Serve only the canonical contract (same file as OpenAPI Generator input); avoids runtime scan drift vs specs/001-mm-order-processing/contracts/openapi.yaml
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
