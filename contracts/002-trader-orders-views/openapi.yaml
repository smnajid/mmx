openapi: 3.0.3
info:
  title: Money Market Order Processing API
  description: |
    Contract-first HTTP API for Money Market order processing. Baseline intake and lifecycle
    operations from `001-mm-order-processing`; **002-trader-orders-views** adds workspace-scoped
    list surfaces (`/term/*`, `/oncall/*`) so Term and OnCall orders are never mixed on the same
    list response. Workspace **Assigned** lists are **desk-wide** (all assignees) per User Story 2.
    Human-readable mirror: [api-v1.md](./api-v1.md). Trader-facing operations require header
    `X-User-Id` (actor identity; Assigned workspace lists are not filtered by assignee).
  version: 2.0.0

servers:
  - url: /
    description: Relative to deployment base (e.g. http://localhost:8080)

tags:
  - name: Intake
    description: Portfolio Management order reception (no Trader header)
  - name: OrderCreation
    description: Portfolio Management order creation wizard options (no Trader header)
  - name: Orders
    description: Trader-facing order operations
  - name: BackOffice
    description: Portfolio accounting callbacks (no X-User-Id; unauthenticated baseline)
  - name: OnCallRateSettings
    description: Trader-facing OnCall rate curve maintenance (institution-scoped)
  - name: Session
    description: MMXUser session scope binding

paths:
  /api/v1/session/scope:
    post:
      tags: [Session]
      summary: Re-bind session to a held (LegalEntity, role) scope
      operationId: reScopeSession
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReScopeRequest"
      responses:
        "200":
          description: Session rebound to the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReScopeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User does not hold the requested scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders:
    post:
      tags: [Intake]
      summary: Receive order (idempotent)
      operationId: receiveOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveOrderRequest"
      responses:
        "201":
          description: New order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveOrderResponse"
        "200":
          description: Duplicate external reference — existing order returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveOrderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/term/received:
    get:
      tags: [Orders]
      summary: List received Term orders
      description: |
        By default (`receivedView=NEAR_TERM`) returns only orders whose `valueDate` falls within **today and the next two calendar days** inclusive in the business calendar (**Europe/Paris**). Use `receivedView=ALL` for the full RECEIVED cohort for this workspace type (session UX may pass this from a trader “show all” control).
      operationId: listReceivedTermOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/ReceivedListView"
      responses:
        "200":
          description: Paged Term orders in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/oncall/received:
    get:
      tags: [Orders]
      summary: List received OnCall orders
      description: |
        Same near-term window behaviour as Term Received; see `GET /api/v1/orders/term/received`.
      operationId: listReceivedOnCallOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/ReceivedListView"
      responses:
        "200":
          description: Paged OnCall orders in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/term/assigned:
    get:
      tags: [Orders]
      summary: List all assigned Term orders (desk-wide)
      description: |
        Returns every order in **ASSIGNED** status with `orderType` **TERM** (all assignees).
        `X-User-Id` identifies the caller and is required for consistency with other Trader
        operations; the response is **not** restricted to orders assigned to that trader.
        Execute and unassign remain assignee-gated on their respective operations.
      operationId: listAssignedTermOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged Term orders in ASSIGNED status (desk-wide)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/oncall/assigned:
    get:
      tags: [Orders]
      summary: List all assigned OnCall orders (desk-wide)
      description: |
        Returns every order in **ASSIGNED** status with `orderType` **ON_CALL** (all assignees).
        `X-User-Id` identifies the caller and is required for consistency; the response is **not**
        restricted to orders assigned to that trader.
      operationId: listAssignedOnCallOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged OnCall orders in ASSIGNED status (desk-wide)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/term/executed:
    get:
      tags: [Orders]
      summary: List executed Term orders (workspace Executed view)
      operationId: listExecutedTermOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged Term orders in EXECUTED status (US1 shell; accounting filters in later stories)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/oncall/executed:
    get:
      tags: [Orders]
      summary: List executed OnCall orders (workspace Executed view)
      operationId: listExecutedOnCallOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged OnCall orders in EXECUTED status (US1 shell; accounting filters in later stories)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/back-office/orders/{orderId}/accounted:
    post:
      tags: [BackOffice]
      summary: Confirm execution accounted (portfolio position updated)
      description: |
        Idempotent callback from back-office. Transitions EXECUTED → ACCOUNTED. Does **not**
        require `X-User-Id` or any other caller authentication for this baseline.
      operationId: markOrderAccounted
      security: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkOrderAccountedRequest"
      responses:
        "200":
          description: Order is now ACCOUNTED or was already ACCOUNTED (idempotent)
        "404":
          description: Order does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid status for accounting confirmation (order must currently be EXECUTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/back-office/oncall-rates/{segmentId}/confirmed:
    post:
      tags: [BackOffice]
      summary: Confirm OnCall rate segment validated by back office
      description: |
        Idempotent callback from back-office. Transitions `PENDING_CONFIRMATION` → `VALID`.
        Does **not** require `X-User-Id` or any other caller authentication for this baseline.
        Returns **409** when the segment was canceled; **404** when unknown.
      operationId: confirmOnCallRateSegment
      security: []
      parameters:
        - $ref: "#/components/parameters/SegmentIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmOnCallRateSegmentRequest"
      responses:
        "200":
          description: Segment is now VALID or was already VALID (idempotent no-op)
        "404":
          description: Segment does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Segment was canceled — cannot confirm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/settings/institutions/{institutionCode}/oncall-rates:
    get:
      tags: [OnCallRateSettings]
      summary: List OnCall rate segments for an institution
      operationId: listOnCallRateSegments
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCodePath"
      responses:
        "200":
          description: Segments for the institution (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OnCallRateSegmentResponse"
        "404":
          description: Institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [OnCallRateSettings]
      summary: Add an OnCall rate to a curve point
      operationId: addOnCallRate
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCodePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOnCallRateRequest"
      responses:
        "201":
          description: Pending segment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnCallRateSegmentResponse"
        "400":
          description: Validation error (e.g. backdated value date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Curve point already has a pending segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/settings/institutions/{institutionCode}/oncall-rates/{segmentId}/cancel:
    post:
      tags: [OnCallRateSettings]
      summary: Cancel a pending OnCall rate segment
      operationId: cancelOnCallRate
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCodePath"
        - $ref: "#/components/parameters/SegmentIdPath"
      responses:
        "200":
          description: Segment canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnCallRateSegmentResponse"
        "404":
          description: Segment or institution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Segment is not pending confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order details
      operationId: getOrderDetails
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Orders]
      summary: Update assigned order
      operationId: updateAssignedOrder
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the assigned Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid status for update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/assign:
    post:
      tags: [Orders]
      summary: Assign order to requesting Trader
      operationId: assignOrder
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/unassign:
    post:
      tags: [Orders]
      summary: Unassign order
      operationId: unassignOrder
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "403":
          description: Caller is not the assigned Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in ASSIGNED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/assigned:
    get:
      deprecated: true
      tags: [Orders]
      summary: List orders assigned to the requesting Trader
      description: |
        Deprecated — mixes Term and OnCall. Use `GET /api/v1/orders/term/assigned` or
        `GET /api/v1/orders/oncall/assigned` (002-trader-orders-views).
      operationId: listAssignedOrders
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged assigned orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummaryPage"

  /api/v1/orders/{orderId}/execute:
    post:
      tags: [Orders]
      summary: Record order execution
      operationId: executeOrder
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteOrderRequest"
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "400":
          description: Missing or invalid execution data, or executedRate below MinimumRate when order has a PM floor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the assigned Trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in ASSIGNED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel received order
      operationId: cancelOrder
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order not in RECEIVED status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/orders/{orderId}/reject:
    post:
      tags: [Orders]
      summary: Reject received or assigned order
      operationId: rejectOrder
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectOrderRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailsResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the assigned Trader (when order is ASSIGNED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Order must be in RECEIVED or ASSIGNED status to reject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/order-creation/term/currencies:
    get:
      tags: [OrderCreation]
      summary: List currencies available for Term order creation
      operationId: listTermCurrencies
      responses:
        "200":
          description: Currencies with at least one viable Term counterparty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermCurrenciesResponse"

  /api/v1/order-creation/oncall/currencies:
    get:
      tags: [OrderCreation]
      summary: List currencies available for OnCall order creation
      operationId: listOnCallCurrencies
      responses:
        "200":
          description: Currencies with at least one viable OnCall counterparty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnCallCurrenciesResponse"

  /api/v1/order-creation/term/operations:
    get:
      tags: [OrderCreation]
      summary: List Term operations for a currency
      operationId: listTermOperations
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        "200":
          description: Allowed Term operations with minimum amounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsResponse"

  /api/v1/order-creation/oncall/operations:
    get:
      tags: [OrderCreation]
      summary: List OnCall operations for a currency
      operationId: listOnCallOperations
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        "200":
          description: Allowed OnCall operations with minimum amounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsResponse"

  /api/v1/order-creation/term/tenors:
    get:
      tags: [OrderCreation]
      summary: List Term tenors for a currency
      operationId: listTermTenors
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        "200":
          description: Enabled tenors with at least one counterparty rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenorsResponse"

  /api/v1/order-creation/oncall/notice-periods:
    get:
      tags: [OrderCreation]
      summary: List OnCall notice periods for a currency
      operationId: listOnCallNoticePeriods
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
      responses:
        "200":
          description: Enabled notice periods with at least one open counterparty segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticePeriodsResponse"

  /api/v1/order-creation/term/counterparties:
    get:
      tags: [OrderCreation]
      summary: List Term counterparties with latest rates
      operationId: listTermCounterparties
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
        - name: tenor
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Tenor"
      responses:
        "200":
          description: Active institutions with latest term rates, best rate first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterpartiesResponse"

  /api/v1/order-creation/oncall/counterparties:
    get:
      tags: [OrderCreation]
      summary: List OnCall counterparties with segment rates for a value date
      operationId: listOnCallCounterparties
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 3
        - name: noticePeriod
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/NoticePeriod"
        - name: valueDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Active institutions with segment rates covering valueDate, best rate first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterpartiesResponse"

  /api/v1/order-creation/contracts:
    get:
      tags: [OrderCreation]
      summary: List live contracts for a portfolio and order type
      operationId: listLiveContracts
      parameters:
        - name: portfolioNumber
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
        - name: orderType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OrderType"
      responses:
        "200":
          description: Live contracts materialised by executed Subscriptions for the portfolio and type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveContractsResponse"

  /api/v1/order-creation/oncall/contract-info:
    get:
      tags: [OrderCreation]
      summary: Resolve contract number to currency and notice period
      operationId: getOnCallContractInfo
      parameters:
        - name: contractNumber
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        "200":
          description: Currency and notice period from executed Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractInfoResponse"
        "404":
          description: No executed OnCall Subscription with this contract number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: MMXUser identity for Trader-facing and settings endpoints
      schema:
        type: string
        minLength: 1

    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SegmentIdPath:
      name: segmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InstitutionCodePath:
      name: institutionCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32

    Page:
      name: page
      in: query
      description: Zero-based page index
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      description: Page size (max 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    ReceivedListView:
      name: receivedView
      in: query
      required: false
      description: |
        `NEAR_TERM` (default): only orders with `valueDate` in the inclusive three-calendar-day window (**today** through **today+2**) in **Europe/Paris**.
        `ALL`: every RECEIVED order for this workspace type (matches legacy unpaged-all behaviour).
      schema:
        $ref: "#/components/schemas/ReceivedListView"

  schemas:
    ErrorCode:
      type: string
      description: Machine-readable error code
      enum:
        - VALIDATION_ERROR
        - ORDER_NOT_FOUND
        - INVALID_STATUS_TRANSITION
        - UNAUTHORIZED_TRADER
        - DUPLICATE_ORDER
        - INSTITUTION_NOT_FOUND
        - ONCALL_SEGMENT_NOT_FOUND
        - ONCALL_PENDING_EXISTS
        - ONCALL_BACKDATED_VALUE_DATE
        - ONCALL_INVALID_SEGMENT_STATUS
        - ONCALL_SEGMENT_CANCELED

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    ReceivedListView:
      type: string
      description: Received list horizon for workspace Received queues (US3)
      enum: [NEAR_TERM, ALL]
      default: NEAR_TERM

    OrderType:
      type: string
      enum: [TERM, ON_CALL]

    OrderOperation:
      type: string
      enum: [SUBSCRIPTION, INCREASE, DECREASE, REDEMPTION]

    OrderStatus:
      type: string
      enum: [RECEIVED, ASSIGNED, EXECUTED, ACCOUNTED, CANCELLED, REJECTED]

    Tenor:
      type: string
      description: Term tenor code
      enum: ["1W", "2W", "1M", "3M", "6M", "1Y"]

    NoticePeriod:
      type: string
      enum: ["24H", "48H"]

    ReceiveOrderRequest:
      type: object
      required:
        - externalOrderReference
        - legalEntityCode
        - orderType
        - orderOperation
        - portfolioNumber
        - currency
        - amount
        - valueDate
        - institutionCode
      properties:
        legalEntityCode:
          type: string
          minLength: 3
          maxLength: 3
          description: Owning LegalEntity code (3 characters, e.g. LOC, PAR).
        externalOrderReference:
          type: string
          maxLength: 100
        orderType:
          $ref: "#/components/schemas/OrderType"
        orderOperation:
          $ref: "#/components/schemas/OrderOperation"
        portfolioNumber:
          type: string
          maxLength: 50
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        valueDate:
          type: string
          format: date
        minimumRate:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Optional PM execution floor; when omitted, Trader executes subject to best market conditions.
        tenor:
          $ref: "#/components/schemas/Tenor"
        noticePeriod:
          $ref: "#/components/schemas/NoticePeriod"
        sourceContractNumber:
          type: string
          nullable: true
          maxLength: 50
          description: >
            Required when orderOperation is INCREASE, DECREASE, or REDEMPTION (existing MM contract).
            When orderOperation is SUBSCRIPTION, MUST NOT be persisted; if supplied, the service discards it at reception.
        institutionCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Active onboarded institution selected by Portfolio Management at order creation.

    ReceiveOrderResponse:
      type: object
      required: [orderId, status, legalEntityCode]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        legalEntityCode:
          type: string
          minLength: 3
          maxLength: 3
          description: Owning LegalEntity code persisted on the order.

    UserRole:
      type: string
      enum: [TRADER, CLIENT_REPRESENTATIVE]

    ReScopeRequest:
      type: object
      required: [legalEntityCode, role]
      properties:
        legalEntityCode:
          type: string
          minLength: 3
          maxLength: 3
        role:
          $ref: "#/components/schemas/UserRole"

    ReScopeResponse:
      type: object
      required: [legalEntityCode, role]
      properties:
        legalEntityCode:
          type: string
          minLength: 3
          maxLength: 3
        role:
          $ref: "#/components/schemas/UserRole"

    OrderSummaryResponse:
      type: object
      required:
        - orderId
        - externalOrderReference
        - orderType
        - orderOperation
        - portfolioNumber
        - currency
        - amount
        - valueDate
        - status
        - createdAt
      properties:
        orderId:
          type: string
          format: uuid
        externalOrderReference:
          type: string
        orderType:
          $ref: "#/components/schemas/OrderType"
        orderOperation:
          $ref: "#/components/schemas/OrderOperation"
        portfolioNumber:
          type: string
        currency:
          type: string
        amount:
          type: number
          format: double
        valueDate:
          type: string
          format: date
        minimumRate:
          type: number
          format: double
          nullable: true
          description: Present when supplied at intake; Trader cannot alter after reception.
        tenor:
          type: string
          nullable: true
          description: Term orders only; echoes intake tenor when applicable.
        noticePeriod:
          type: string
          nullable: true
          description: OnCall orders only; echoes intake notice period when applicable (24H, 48H).
        status:
          $ref: "#/components/schemas/OrderStatus"
        assignedTraderId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        counterparty:
          type: string
          nullable: true
          description: |
            Institution display name derived from intake institutionCode.
            Omit from JSON when null (omit-null serialization).
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        institutionCode:
          type: string
          nullable: true
          maxLength: 32
          description: |
            Catalog institution code selected by Portfolio Management at intake.
            Omit from JSON when null (omit-null serialization).
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
        handoffStatus:
          $ref: "#/components/schemas/HandoffStatus"
          nullable: true
          description: |
            Back-office Kafka handoff delivery state for EXECUTED orders (`PENDING` = outbox not yet acked,
            `PUBLISHED` = producer ack received, `FAILED` = publish retries exhausted).
            Omitted when null or when status is not EXECUTED (omit-null serialization).
          x-field-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"

    HandoffStatus:
      type: string
      enum: [PENDING, PUBLISHED, FAILED]
      description: Integration handoff state for executed-not-accounted rows (distinct from lifecycle OrderStatus).

    MarkOrderAccountedRequest:
      type: object
      properties:
        accountedAt:
          type: string
          format: date-time
          nullable: true
          description: Optional bookkeeping timestamp supplied by caller; baseline processing may ignore it.

    OrderDetailsResponse:
      type: object
      required:
        - orderId
        - externalOrderReference
        - orderType
        - orderOperation
        - portfolioNumber
        - currency
        - amount
        - valueDate
        - status
        - createdAt
        - updatedAt
      properties:
        orderId:
          type: string
          format: uuid
        externalOrderReference:
          type: string
        orderType:
          $ref: "#/components/schemas/OrderType"
        orderOperation:
          $ref: "#/components/schemas/OrderOperation"
        portfolioNumber:
          type: string
        currency:
          type: string
        amount:
          type: number
          format: double
        valueDate:
          type: string
          format: date
        minimumRate:
          type: number
          format: double
          nullable: true
          description: Optional PM execution floor when supplied at intake; immutable after reception.
        tenor:
          type: string
          nullable: true
        noticePeriod:
          type: string
          nullable: true
        sourceContractNumber:
          type: string
          nullable: true
          description: >
            Intake contract reference for lifecycle operations (INCREASE, DECREASE, REDEMPTION); null for Subscription
            (PM-supplied value is discarded at reception). After execute on lifecycle orders, echoes the same reference
            as used for execution contract identity.
        status:
          $ref: "#/components/schemas/OrderStatus"
        assignedTraderId:
          type: string
          nullable: true
        assignedAt:
          type: string
          format: date-time
          nullable: true
        executedRate:
          type: number
          format: double
          nullable: true
        counterparty:
          type: string
          nullable: true
          description: Institution display name derived from intake institutionCode.
        institutionCode:
          type: string
          nullable: true
          maxLength: 32
          description: Catalog institution code selected by Portfolio Management at intake.
        executionTime:
          type: string
          format: date-time
          nullable: true
        dealingReference:
          type: string
          nullable: true
        generatedContractNumber:
          type: string
          nullable: true
          description: >
            After execution: new Money Market contract reference allocated by the system for SUBSCRIPTION orders;
            for INCREASE, DECREASE, and REDEMPTION equals the persisted intake sourceContractNumber (same underlying contract).
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderSummaryPage:
      type: object
      required: [content, totalElements, page, size]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummaryResponse"
        totalElements:
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1

    UpdateOrderRequest:
      type: object
      description: Partial update — only Amount and ValueDate may be changed. MinimumRate, institutionCode, and counterparty are intake-only and not mutable via this endpoint.
      properties:
        amount:
          type: number
          format: double
          exclusiveMinimum: 0
        valueDate:
          type: string
          format: date

    ExecuteOrderRequest:
      type: object
      required: [executedRate]
      properties:
        executedRate:
          type: number
          format: double
          minimum: 0

    TermCurrenciesResponse:
      type: object
      required: [tradingDate, currencies]
      properties:
        tradingDate:
          type: string
          format: date
          description: Today's business date used for indicative rate comparisons.
        currencies:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 3

    OnCallCurrenciesResponse:
      type: object
      required: [currencies]
      properties:
        currencies:
          type: array
          items:
            type: string
            minLength: 3
            maxLength: 3

    OperationsResponse:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: "#/components/schemas/OperationOption"

    OperationOption:
      type: object
      required: [operation, minAmount]
      properties:
        operation:
          $ref: "#/components/schemas/OrderOperation"
        minAmount:
          type: number
          format: double
          exclusiveMinimum: 0

    TenorsResponse:
      type: object
      required: [tenors]
      properties:
        tenors:
          type: array
          items:
            $ref: "#/components/schemas/Tenor"

    NoticePeriodsResponse:
      type: object
      required: [noticePeriods]
      properties:
        noticePeriods:
          type: array
          items:
            $ref: "#/components/schemas/NoticePeriod"

    CounterpartiesResponse:
      type: object
      required: [counterparties]
      properties:
        counterparties:
          type: array
          items:
            $ref: "#/components/schemas/CounterpartyOption"

    CounterpartyOption:
      type: object
      required:
        - institutionCode
        - displayName
        - rate
        - rateDate
        - indicative
      properties:
        institutionCode:
          type: string
          maxLength: 32
        displayName:
          type: string
          maxLength: 128
        rate:
          type: number
          format: double
        rateDate:
          type: string
          format: date
          description: Trading date (Term) or segment value date (OnCall) for the quoted rate.
        indicative:
          type: boolean
          description: True when the rate is stale or otherwise not from today's trading date.

    ContractInfoResponse:
      type: object
      required: [currency, noticePeriod, institutionCode, counterparty]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        noticePeriod:
          $ref: "#/components/schemas/NoticePeriod"
        institutionCode:
          type: string
          maxLength: 32
          description: Institution code from the executed Subscription order.
        counterparty:
          type: string
          maxLength: 128
          description: Institution display name from the executed Subscription order.

    LiveContract:
      type: object
      required:
        - contractNumber
        - orderType
        - currency
        - valueDate
        - originalAmount
      properties:
        contractNumber:
          type: string
          minLength: 1
          maxLength: 50
          description: generatedContractNumber of the executed Subscription
        orderType:
          $ref: "#/components/schemas/OrderType"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        noticePeriod:
          $ref: "#/components/schemas/NoticePeriod"
          description: OnCall only; omitted for Term contracts (omit-null).
        tenor:
          $ref: "#/components/schemas/Tenor"
          description: Term only; omitted for OnCall contracts (omit-null).
        valueDate:
          type: string
          format: date
          description: Subscription value date
        endDate:
          type: string
          format: date
          description: Term only — valueDate plus tenor duration; omitted for OnCall (omit-null).
        originalAmount:
          type: number
          format: double
          exclusiveMinimum: 0
          description: Subscription amount at contract creation (reference, not a running balance).

    LiveContractsResponse:
      type: object
      required: [contracts]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/LiveContract"

    OnCallRateSegmentStatus:
      type: string
      enum: [PENDING_CONFIRMATION, VALID, CANCELED]

    OnCallNoticePeriod:
      type: string
      enum: [24H, 48H]

    AddOnCallRateRequest:
      type: object
      required: [currency, noticePeriod, rate, valueDate]
      properties:
        currency:
          type: string
          minLength: 1
        noticePeriod:
          $ref: "#/components/schemas/OnCallNoticePeriod"
        rate:
          type: number
          format: double
        valueDate:
          type: string
          format: date
          description: Inclusive segment start; must be today or later.

    OnCallRateSegmentResponse:
      type: object
      required:
        - segmentId
        - institutionCode
        - currency
        - noticePeriod
        - rate
        - valueDate
        - endDate
        - status
      properties:
        segmentId:
          type: string
          format: uuid
        institutionCode:
          type: string
        currency:
          type: string
        noticePeriod:
          $ref: "#/components/schemas/OnCallNoticePeriod"
        rate:
          type: number
          format: double
        valueDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Inclusive end; open segment uses sentinel 2999-12-31.
        status:
          $ref: "#/components/schemas/OnCallRateSegmentStatus"
        validatedAt:
          type: string
          format: date-time
          description: Present when status is VALID.

    ConfirmOnCallRateSegmentRequest:
      type: object
      description: Optional body; mmx stamps validatedAt server-side.
      properties: {}

    RejectOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
