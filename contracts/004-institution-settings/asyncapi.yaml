asyncapi: 3.0.0
info:
  title: MMX Institution Export (async)
  version: 1.0.0
  description: |
    Contract-first async surface for the institution export: MMX publishes each LegalEntity's
    institution state (counterparty accounts, closed-to-new-business flag) to that LegalEntity's own
    back-office instance through a transactional outbox and relay.
    Prose mirror: asyncapi-v1.md

defaultContentType: application/json

channels:
  institutionExport:
    address: mmx.institution.{legalEntityCode}
    description: |
      One topic per owning LegalEntity (e.g. `mmx.institution.LOC`, `mmx.institution.PAR`). A
      LegalEntity's institution state is never published to another LegalEntity's topic. All topics
      share Schema Registry subject `mmx.institution-value`.
    parameters:
      legalEntityCode:
        description: The owning LegalEntityCode of the institution.
    messages:
      institutionUpdatedV1:
        $ref: '#/components/messages/InstitutionUpdatedV1'

operations:
  publishInstitutionUpdated:
    action: send
    channel:
      $ref: '#/channels/institutionExport'
    summary: MMX publishes an institution export after transactional outbox relay
    description: |
      One outbox row is committed in the same transaction as the institution change: onboarding,
      re-onboarding, counterparty-account change, client offboarding, hub-institution
      deactivation/reactivation. A request that changes no exported field records nothing.
    messages:
      - $ref: '#/channels/institutionExport/messages/institutionUpdatedV1'

components:
  messages:
    InstitutionUpdatedV1:
      name: InstitutionUpdatedV1
      title: Institution export (v1)
      summary: Full-state institution snapshot; latest-wins by version
      contentType: application/json
      bindings:
        kafka:
          key:
            type: string
            description: Kafka record key = `institutionCode`, so all versions of one institution share a partition.
      payload:
        $ref: './schemas/InstitutionUpdatedV1.json'
