openapi: 3.0.3
info:
  title: MMX Institution Settings API
  description: |
    Institution catalog for desk settings and execution selection, role-scoped to the active
    `(LegalEntity, role)`. A Trader on a TradingHub maintains native institutions; a
    ClientRepresentative on a TradingClient onboards **granted institutions** into **onboarded
    institutions**, maintains their **counterparty accounts**, and controls their **client
    enablement**. Mirror: [api-v1.md](./api-v1.md). Institution export (async): [asyncapi.yaml](./asyncapi.yaml).
  version: 1.0.0

servers:
  - url: /
    description: Relative to deployment base

tags:
  - name: InstitutionSettings
    description: Native and onboarded institution catalog, counterparty accounts, client enablement

paths:
  /api/v1/settings/institutions:
    get:
      tags: [InstitutionSettings]
      summary: List institutions
      operationId: listInstitutions
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
          description: When true, return only active institutions (for execute autocomplete).
      responses:
        "200":
          description: Catalog entries (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstitutionResponse"
    post:
      tags: [InstitutionSettings]
      summary: Onboard an institution
      description: |
        Role-qualified. A Trader on a TradingHub onboards a native institution by `displayName`. A
        ClientRepresentative on a TradingClient onboards a **granted institution** by
        `hubInstitutionCode` (at least one active grant, any currency); the `displayName` is derived
        as `"{hub displayName} via {hubLegalEntityCode}"`. Onboarding an offboarded institution
        re-onboards (reopens) the same record and returns `200`; a new record returns `201`. Every
        success records an institution export.
      operationId: onboardInstitution
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardInstitutionRequest"
      responses:
        "200":
          description: Offboarded onboarded institution re-onboarded (same `institutionCode`; supplied accounts replace the stored ones, absent ones are kept)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "201":
          description: Institution created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/settings/institutions/granted:
    get:
      tags: [InstitutionSettings]
      summary: List granted institutions (ClientRepresentative)
      description: |
        Hub institutions for which the active TradingClient holds at least one active delegated grant
        (any currency), joined with the hub display names and with the client's own onboarded
        institutions. A remote client reads grants and hub names live from its hub. Trader → `403`.
      operationId: listGrantedInstitutions
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
      responses:
        "200":
          description: Granted institutions (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrantedInstitutionResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/settings/institutions/{institutionCode}:
    get:
      tags: [InstitutionSettings]
      summary: Get institution by code
      description: |
        An institution owned by the active scope's LegalEntity (its counterparty accounts and client
        enablement belong to that LegalEntity); any other institution is `404`.
      operationId: getInstitution
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCode"
      responses:
        "200":
          description: Institution entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/settings/institutions/{institutionCode}/deactivate:
    post:
      tags: [InstitutionSettings]
      summary: Deactivate (Trader) or offboard (ClientRepresentative) an institution
      description: |
        Trader on a TradingHub: deactivates a native institution (closed to new business).
        ClientRepresentative on a TradingClient: **offboards** an onboarded institution (closed to new
        business, accounts kept, never deleted); idempotent. Records an institution export when the
        state changes.
      operationId: deactivateInstitution
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCode"
      responses:
        "200":
          description: Institution deactivated / offboarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/settings/institutions/{institutionCode}/activate:
    post:
      tags: [InstitutionSettings]
      summary: Reactivate (Trader) or re-onboard (ClientRepresentative) an institution
      description: |
        Trader on a TradingHub: reactivates a native institution. ClientRepresentative on a
        TradingClient: **re-onboards** an offboarded onboarded institution (same record, same
        accounts); requires at least one active grant for the linked hub institution. Records an
        institution export when the state changes.
      operationId: activateInstitution
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCode"
      responses:
        "200":
          description: Institution activated / re-onboarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/settings/institutions/{institutionCode}/counterparty-accounts:
    put:
      tags: [InstitutionSettings]
      summary: Replace the Term and OnCall counterparty accounts
      description: |
        Full replacement; a null or absent account clears it. Only the owning scope's settings role
        may call it (Trader on a TradingHub for native institutions, ClientRepresentative on a
        TradingClient for onboarded institutions); an institution outside the active scope is `404`.
        Allowed while closed to new business. Clearing an account is rejected (`409`) while any tenor
        or notice period of that OrderType is client-enabled on the institution. Records an
        institution export only when a value changes.
      operationId: updateCounterpartyAccounts
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCounterpartyAccountsRequest"
      responses:
        "200":
          description: Accounts stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/settings/institutions/{institutionCode}/enablement/{currency}:
    put:
      tags: [InstitutionSettings]
      summary: Replace the client enablement of an onboarded institution for one currency
      description: |
        ClientRepresentative only (Trader → `403`). Full replacement of the tenors (Term) and notice
        periods (OnCall) switched on for new business for `(institutionCode, currency)`. Every value
        newly switched on must be enabled by the current active grant (a value already enabled may be
        kept after the grant stops enabling it: "enabled, not granted"), and a Term tenor requires the Term counterparty
        account (an OnCall notice period the OnCall account); otherwise `400`. Stored in the client's
        own deployment only; never sent to the hub; records no institution export.
      operationId: updateClientEnablement
      parameters:
        - $ref: "#/components/parameters/UserIdHeader"
        - $ref: "#/components/parameters/InstitutionCode"
        - name: currency
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientEnablementRequest"
      responses:
        "200":
          description: Client enablement stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

components:
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    InstitutionCode:
      name: institutionCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstitutionSettingsErrorResponse"
    ConflictError:
      description: |
        Suffix overflow for the acronym base (`INSTITUTION_SUFFIX_OVERFLOW`), duplicate onboarding of an
        open onboarded institution (`INSTITUTION_ALREADY_ONBOARDED`), or clearing a counterparty account
        still in use by client enablement (`COUNTERPARTY_ACCOUNT_IN_USE`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstitutionSettingsErrorResponse"
    ForbiddenError:
      description: The active role may not perform this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstitutionSettingsErrorResponse"
    NotFoundError:
      description: Institution not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InstitutionSettingsErrorResponse"

  schemas:
    TenorCode:
      type: string
      enum: ["1W", "2W", "1M", "3M", "6M", "1Y"]

    NoticePeriodCode:
      type: string
      enum: ["24H", "48H"]

    CounterpartyAccount:
      type: string
      minLength: 1
      maxLength: 34
      nullable: true
      description: Non-blank reference (trimmed, at most 34 characters); no currency dimension. Null when unset.

    InstitutionResponse:
      type: object
      required: [institutionCode, displayName, active, closedToNewBusiness]
      properties:
        institutionCode:
          type: string
          maxLength: 32
        displayName:
          type: string
          maxLength: 128
        active:
          type: boolean
          description: Legacy flag; `false` exactly when `closedToNewBusiness` is `true`.
        closedToNewBusiness:
          type: boolean
          description: >
            True for a deactivated native institution or an offboarded onboarded institution:
            Subscription/Increase refused, Decrease/Redemption still accepted.
        termCounterpartyAccount:
          $ref: "#/components/schemas/CounterpartyAccount"
        onCallCounterpartyAccount:
          $ref: "#/components/schemas/CounterpartyAccount"
        hubInstitutionCode:
          type: string
          maxLength: 32
          description: Present on onboarded institutions; the linked hub-native institution code.
        hubLegalEntityCode:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Present on onboarded institutions; the linked TradingHub LegalEntity code.
        enablements:
          type: array
          description: >
            Onboarded institutions on single-institution responses (get, onboard, activate/deactivate,
            counterparty accounts, enablement): one entry per currency that is granted or client-enabled;
            empty on the list response and for native institutions. A
            value in `enabledTenors`/`enabledNoticePeriods` but not in the granted set is "enabled,
            not granted" (capped out of the effective enablement).
          items:
            $ref: "#/components/schemas/ClientEnablementResponse"

    ClientEnablementResponse:
      type: object
      required: [currency, grantedTenors, grantedNoticePeriods, enabledTenors, enabledNoticePeriods]
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        grantedTenors:
          type: array
          description: Tenors enabled by the active grant (empty when the grant is inactive or absent).
          items:
            $ref: "#/components/schemas/TenorCode"
        grantedNoticePeriods:
          type: array
          items:
            $ref: "#/components/schemas/NoticePeriodCode"
        enabledTenors:
          type: array
          description: Tenors the ClientRepresentative switched on (client enablement).
          items:
            $ref: "#/components/schemas/TenorCode"
        enabledNoticePeriods:
          type: array
          items:
            $ref: "#/components/schemas/NoticePeriodCode"

    OnboardInstitutionRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
          description: Trader native onboard only; rejected for a ClientRepresentative.
        hubInstitutionCode:
          type: string
          minLength: 1
          maxLength: 32
          description: >
            ClientRepresentative institution onboarding — a granted hub-native institution. Mutually
            exclusive with a Trader native onboard by displayName.
        termCounterpartyAccount:
          $ref: "#/components/schemas/CounterpartyAccount"
        onCallCounterpartyAccount:
          $ref: "#/components/schemas/CounterpartyAccount"

    UpdateCounterpartyAccountsRequest:
      type: object
      description: Full replacement; null or absent clears the account.
      properties:
        termCounterpartyAccount:
          $ref: "#/components/schemas/CounterpartyAccount"
        onCallCounterpartyAccount:
          $ref: "#/components/schemas/CounterpartyAccount"

    UpdateClientEnablementRequest:
      type: object
      required: [enabledTenors, enabledNoticePeriods]
      properties:
        enabledTenors:
          type: array
          items:
            $ref: "#/components/schemas/TenorCode"
        enabledNoticePeriods:
          type: array
          items:
            $ref: "#/components/schemas/NoticePeriodCode"

    GrantedInstitutionResponse:
      type: object
      required: [hubLegalEntityCode, hubInstitutionCode, displayName, currencies]
      properties:
        hubLegalEntityCode:
          type: string
          pattern: "^[A-Z]{3}$"
        hubInstitutionCode:
          type: string
          maxLength: 32
        displayName:
          type: string
          maxLength: 128
          description: Derived `"{hub displayName} via {hubLegalEntityCode}"`.
        currencies:
          type: array
          description: Currencies with an active grant.
          items:
            type: string
            pattern: "^[A-Z]{3}$"
        onboardedInstitutionCode:
          type: string
          maxLength: 32
          description: Present when the client has onboarded this hub institution.
        closedToNewBusiness:
          type: boolean
          description: Present with `onboardedInstitutionCode`; true when offboarded.

    InstitutionSettingsErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INSTITUTION_NOT_FOUND
        - INSTITUTION_SUFFIX_OVERFLOW
        - INSTITUTION_ALREADY_ONBOARDED
        - COUNTERPARTY_ACCOUNT_IN_USE
        - FORBIDDEN

    InstitutionSettingsErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/InstitutionSettingsErrorCode"
        message:
          type: string
